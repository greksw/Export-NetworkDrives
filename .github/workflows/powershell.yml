name: PowerShell CI

on:
  push:
    branches:
      - main
      - 'portfolio/**'
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          foreach ($file in @('Export-NetworkDrives.ps1', 'Import-NetworkDrives.ps1')) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  (Join-Path $PWD $file),
                  [ref]$tokens,
                  [ref]$errors
              )
              if ($errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error "$file: $($_.Message)" -ErrorAction Continue }
                  $failed = $true
              }
          }
          if ($failed) { throw 'PowerShell parser validation failed.' }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer \
              -Path . \
              -Recurse \
              -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results) {
              throw "PSScriptAnalyzer reported $($results.Count) warning/error finding(s)."
          }
